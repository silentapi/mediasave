services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
      # Optional yt-dlp cookies file (set COOKIES_PATH=/run/secrets/cookies.txt in .env):
      # - ./cookies.txt:/run/secrets/cookies.txt:ro
    ports:
      - "127.0.0.1:8000:8000"   # direct access for local testing / smoke.sh; Caddy is the public face
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"                                   # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"                                 # ACME TLS-ALPN challenge (and the site when SITE_PORT=443)
      - "${SITE_PORT:-443}:${SITE_PORT:-443}"     # the site itself (e.g. 6666)
      - "${SITE_PORT:-443}:${SITE_PORT:-443}/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
